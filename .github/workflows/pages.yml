name: pages

# Publishes the interactive "how it works" slideshow in site/ to GitHub
# Pages. Static files only — no build step.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/configure-pages@v5.0.0

      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4.0.5
