name: build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# id-token: write — OIDC for the AWS IoT OTA job (only fires on tag).
# contents: write — needed by the release job for `gh release create`.
permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build firmware for every supported board in parallel. A secret-scan guard
  # ensures the resulting binaries never contain AWS endpoints, per-device
  # private keys, or unexpected certificate blocks. The bundled Amazon Root
  # CA 1 is allowed (exactly one BEGIN CERTIFICATE block expected).
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.board.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - { name: xiao_esp32c6,           fqbn: "esp32:esp32:XIAO_ESP32C6" }
          - { name: dfrobot_beetle_esp32c6, fqbn: "esp32:esp32:dfrobot_beetle_esp32c6" }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: version
        name: Resolve firmware version
        run: |
          # git is available on the runner (not inside the Docker container
          # the build runs in), so we resolve the SHA here and pass it down
          # via $GITHUB_ENV. Without this, build.sh ran `git rev-parse`
          # inside the container, failed silently because git/.git aren't
          # exposed there, and baked "nogit" into FW_VERSION.
          SHA="$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(date -u +%Y-%m-%d)+${SHA}"
          fi
          echo "GIT_SHA=${SHA}"      >> "$GITHUB_ENV"
          echo "FW_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}"  >> "$GITHUB_OUTPUT"
          echo "Resolved FW_VERSION=${VERSION} (GIT_SHA=${SHA})"

      - name: Build via docker-build.sh
        env:
          FQBN: ${{ matrix.board.fqbn }}
          OUT_DIR: build
          # ENABLE_AWS_IOT defaults to 1 in scripts/build.sh; pinned here for
          # clarity. The runtime-loaded credentials flow means the binary
          # still has no AWS material baked in.
          #ENABLE_AWS_IOT: "1" < this owerrides GitHub action vars if set.
          ENABLE_AWS_IOT: ${{ vars.ENABLE_AWS_IOT || '1' }}
        run: |
          chmod +x scripts/docker-build.sh scripts/build.sh
          ./scripts/docker-build.sh

      - name: Secret-scan guard
        run: |
          set -euo pipefail
          ELF="build/onair-led-sign-firmware.ino.elf"
          test -f "$ELF" || { echo "missing $ELF" >&2; exit 1; }

          # The strings dump from the linked ELF picks up three categories
          # of PEM-marker-shaped noise that are NOT real credentials:
          #   1. Captive-portal HTML placeholder attrs:
          #        placeholder='xxxx-ats.iot.&lt;region&gt;.amazonaws.com'
          #        placeholder='-----BEGIN PRIVATE KEY-----'
          #        placeholder='-----BEGIN CERTIFICATE-----'
          #   2. mbedTLS PEM-parsing constants — linking setPrivateKey()
          #      and setCertificate() pulls in literals like
          #        -----BEGIN/END CERTIFICATE-----
          #        -----BEGIN/END RSA PRIVATE KEY-----
          #        -----BEGIN/END EC PRIVATE KEY-----
          #      used internally by the parser, all as bare strings with
          #      no base64 content attached.
          #   3. Comments / docstrings that mention PEM markers but were
          #      stripped (no compiled remnant).
          #
          # The robust discriminator: every real X.509 certificate and
          # PKCS-encoded private key base64-encodes an ASN.1 SEQUENCE
          # (first byte 0x30), which always renders as a base64 line
          # starting with "MII". HTML placeholders and library constants
          # never have a base64 body, so counting distinct MII-prefixed
          # lines gives the actual number of PEM blobs in the binary.

          # Reject real ATS endpoints: full <alnum>-ats.iot.<alnum-or-dash>+
          # .amazonaws.com pattern. Placeholder's `&lt;region&gt;` section
          # contains `&` and `;` and never matches; a real endpoint does.
          BAD_HOST="$(strings "$ELF" | grep -E '[a-z0-9]+-ats\.iot\.[a-z0-9-]+\.amazonaws\.com' || true)"

          # Distinct base64 PEM-body start lines.
          PEM_STARTS="$(strings "$ELF" | grep -E '^MII[A-Za-z0-9+/=]{50,}$' | sort -u || true)"
          PEM_COUNT=0
          if [ -n "$PEM_STARTS" ]; then
            PEM_COUNT="$(printf '%s\n' "$PEM_STARTS" | wc -l)"
          fi

          # Known marker for the bundled Amazon Root CA 1 — first base64
          # line of its PEM body. If this is missing the bundled CA was
          # not linked in correctly; if it's present but PEM_COUNT > 1,
          # some other cert or key got embedded as well.
          AMAZON_CA1_FIRST='MIIDQTCCAimgAwIBAgITBmyfz5m/jAo54vB4ikPmljZbyjANBgkqhkiG9w0BAQsF'

          fail=0
          if [ -n "$BAD_HOST" ]; then
            echo "::error::endpoint string in binary: $BAD_HOST"
            fail=1
          fi
          if ! printf '%s\n' "$PEM_STARTS" | grep -qxF "$AMAZON_CA1_FIRST"; then
            echo "::error::bundled Amazon Root CA 1 not found in binary"
            fail=1
          fi
          if [ "$PEM_COUNT" -gt 1 ]; then
            echo "::error::found $PEM_COUNT distinct PEM bodies in binary; expected 1 (Amazon Root CA 1)"
            echo "matched first-base64 lines:"
            printf '%s\n' "$PEM_STARTS" | sed 's/^/  /'
            fail=1
          fi
          if [ $fail -eq 0 ]; then
            echo "secret-scan: clean (1 PEM body found: Amazon Root CA 1)"
          fi
          exit $fail

      - name: Rename and checksum
        env:
          BOARD:   ${{ matrix.board.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          PREFIX="onair-led-sign-${BOARD}-${VERSION}"
          cp build/onair-led-sign-firmware.ino.merged.bin "out/${PREFIX}.merged.bin"
          cp build/onair-led-sign-firmware.ino.bin        "out/${PREFIX}.bin"
          cp build/onair-led-sign-firmware.ino.elf        "out/${PREFIX}.elf"
          (cd out && sha256sum "${PREFIX}".* > "${PREFIX}.SHA256SUMS.txt")

      - name: Upload board artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board.name }}-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # On a v* tag: bundle every board's artifacts into one GitHub Release. No
  # AWS dependency — works for any fork of the project.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: firmware-*
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Automated release. AWS IoT provisioning, OTA, and the local-only flash flow are covered in PROVISIONING_PLAN.md." \
            release-assets/*

  # ---------------------------------------------------------------------------
  # Optional AWS IoT OTA push. Skipped when AWS_OTA_BUCKET is not set as a
  # repo/org variable. Uploads the XIAO board's .bin to S3 and (when
  # FW_THING_GROUP is also set) creates a tagged IoT Job.
  # ---------------------------------------------------------------------------
  ota:
    name: AWS IoT OTA
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.AWS_OTA_BUCKET != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-xiao_esp32c6-${{ needs.build.outputs.version }}
          path: assets/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: s3
        name: Upload to S3
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUCKET:  ${{ vars.AWS_OTA_BUCKET }}
        run: |
          set -euo pipefail
          BIN="$(ls assets/onair-led-sign-xiao_esp32c6-*.bin | grep -v merged.bin | head -n1)"
          SHA="$(sha256sum "$BIN" | awk '{print $1}')"
          SIZE="$(stat -c%s "$BIN")"
          KEY="firmware/onair-${VERSION}.bin"
          aws s3 cp "$BIN" "s3://${BUCKET}/${KEY}" \
            --metadata "sha256=${SHA},version=${VERSION}" \
            --content-type application/octet-stream
          URL="$(aws s3 presign "s3://${BUCKET}/${KEY}" --expires-in 86400)"
          echo "url=$URL"     >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"  >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"   >> "$GITHUB_OUTPUT"

      - name: Create IoT Job
        if: vars.FW_THING_GROUP != ''
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256:  ${{ steps.s3.outputs.sha256 }}
          SIZE:    ${{ steps.s3.outputs.size }}
          URL:     ${{ steps.s3.outputs.url }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          JOB_ID="onair-ota-${VERSION//[^a-zA-Z0-9-]/-}"
          TARGET_ARN="arn:aws:iot:${AWS_REGION}:${ACCOUNT_ID}:thinggroup/${{ vars.FW_THING_GROUP }}"

          jq -n \
            --arg op   "ota" \
            --arg ver  "$VERSION" \
            --arg url  "$URL" \
            --arg sha  "$SHA256" \
            --argjson size "$SIZE" \
            '{operation:$op, fw_version:$ver, url:$url, sha256:$sha, size:$size}' \
            > job-document.json

          aws iot create-job \
            --job-id "$JOB_ID" \
            --targets "$TARGET_ARN" \
            --document "file://job-document.json" \
            --target-selection SNAPSHOT \
            --job-executions-rollout-config '{
              "exponentialRate": {
                "baseRatePerMinute": 5,
                "incrementFactor": 2,
                "rateIncreaseCriteria": {"numberOfNotifiedThings": 10}
              },
              "maximumPerMinute": 50
            }' \
            --abort-config '{
              "criteriaList": [{
                "failureType": "FAILED",
                "action": "CANCEL",
                "thresholdPercentage": 25,
                "minNumberOfExecutedThings": 5
              }]
            }'

          echo "Created IoT Job: $JOB_ID"
